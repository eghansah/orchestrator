syntax = "proto3";

package orchestrator;

import "types.proto";

option go_package = "github.com/eghansah/orchestrator/internal/grpc/gen";

// ControlService is used by the `ctl` CLI (and any external client) to
// submit workloads, inspect cluster state, and manage nodes.
// Requests may be sent to any node; non-leaders forward to the current leader.
service ControlService {
  // SubmitContainer schedules a single container workload.
  rpc SubmitContainer(SubmitContainerRequest) returns (SubmitResponse);

  // SubmitStack schedules a compose stack workload.
  rpc SubmitStack(SubmitStackRequest) returns (SubmitResponse);

  // RemoveWorkload removes a workload from the cluster.
  rpc RemoveWorkload(RemoveWorkloadRequest) returns (RemoveWorkloadResponse);

  // ListWorkloads returns all known workloads and their current phase.
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);

  // ListNodes returns all nodes and their current status.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // DrainNode marks a node as draining and reschedules its workloads.
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);

  // GetClusterState returns a full snapshot of nodes and workloads.
  rpc GetClusterState(GetClusterStateRequest) returns (GetClusterStateResponse);

  // CreateIngress adds an ingress routing rule.
  rpc CreateIngress(CreateIngressRequest) returns (CreateIngressResponse);

  // DeleteIngress removes an ingress routing rule.
  rpc DeleteIngress(DeleteIngressRequest) returns (DeleteIngressResponse);

  // ListIngress returns all ingress routing rules.
  rpc ListIngress(ListIngressRequest) returns (ListIngressResponse);

  // CreateService creates a named service with a system-assigned TCP port.
  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse);

  // DeleteService removes a service.
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);

  // ListService returns all services.
  rpc ListService(ListServiceRequest) returns (ListServiceResponse);

  // CreateSecret stores a new named secret in OpenBao and records its path in Raft.
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);

  // DeleteSecret removes a secret from OpenBao and from Raft.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // ListSecrets returns all secret metadata (never plaintext values).
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // SetOpenBaoConfig stores the OpenBao connection configuration in cluster state.
  rpc SetOpenBaoConfig(SetOpenBaoConfigRequest) returns (SetOpenBaoConfigResponse);

  // GetOpenBaoStatus returns the current configuration and a live connection health check.
  rpc GetOpenBaoStatus(GetOpenBaoStatusRequest) returns (GetOpenBaoStatusResponse);
}

message SubmitContainerRequest {
  ContainerSpec spec = 1;
}

message SubmitStackRequest {
  ComposeStackSpec spec = 1;
}

message SubmitResponse {
  string workload_id = 1;
  bool   accepted    = 2;
  string reason      = 3; // non-empty on rejection
}

message ListWorkloadsRequest {
  // Optional filter by phase; empty = all phases.
  repeated WorkloadPhase phases = 1;
}

message ListWorkloadsResponse {
  repeated Workload workloads = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message DrainNodeRequest {
  string node_id = 1;
}

message DrainNodeResponse {
  bool   accepted = 1;
  string reason   = 2;
}

message GetClusterStateRequest {}

message GetClusterStateResponse {
  repeated Node     nodes     = 1;
  repeated Workload workloads = 2;
  string leader_id            = 3;
}

message CreateIngressRequest {
  string host           = 1; // Host header to match; empty = match all
  string path_prefix    = 2; // URL path prefix; empty = "/"
  string container_fqdn = 3; // target container: "workload" or "service.workload"
  uint32 container_port = 4; // port the container listens on
}

message CreateIngressResponse {
  string rule_id    = 1;
  bool   accepted   = 2;
  string reason     = 3;
  uint32 system_port = 4; // auto-assigned ingress port
}

message DeleteIngressRequest {
  string rule_id = 1;
}

message DeleteIngressResponse {
  bool   accepted = 1;
  string reason   = 2;
}

message ListIngressRequest {}

message ListIngressResponse {
  repeated IngressRule rules = 1;
}

message CreateServiceRequest {
  string name           = 1; // short DNS label, e.g. "api"
  string container_fqdn = 2; // target container: "workload" or "service.workload"
  uint32 container_port = 3; // port the container listens on
}

message CreateServiceResponse {
  string service_id  = 1;
  uint32 system_port = 2; // auto-assigned
  bool   accepted    = 3;
  string reason      = 4;
}

message DeleteServiceRequest {
  string service_id = 1;
}

message DeleteServiceResponse {
  bool   accepted = 1;
  string reason   = 2;
}

message ListServiceRequest {}

message ListServiceResponse {
  repeated Service services = 1;
}

message SetOpenBaoConfigRequest {
  string address = 1;
  string token   = 2;
  string mount   = 3; // KV v2 mount path (default "secret")
}

message SetOpenBaoConfigResponse {
  bool   accepted = 1;
  string reason   = 2;
}

message GetOpenBaoStatusRequest {}

message GetOpenBaoStatusResponse {
  bool   configured = 1; // true when an address has been stored
  string address    = 2;
  string mount      = 3;
  bool   connected  = 4; // live health probe result
  string error      = 5; // non-empty when connected=false
}

message CreateSecretRequest {
  string name  = 1; // unique cluster-wide label
  string value = 2; // plaintext; written to OpenBao, never stored in Raft
}

message CreateSecretResponse {
  string secret_id = 1;
  bool   accepted  = 2;
  string reason    = 3;
}

message DeleteSecretRequest {
  string secret_id = 1;
}

message DeleteSecretResponse {
  bool   accepted = 1;
  string reason   = 2;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  repeated Secret secrets = 1; // metadata only — no values
}
