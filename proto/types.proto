syntax = "proto3";

package orchestrator;

option go_package = "github.com/eghansah/orchestrator/internal/grpc/gen";

// ── Workload specs ────────────────────────────────────────────────────────────

message ContainerSpec {
  string name        = 1;
  string image       = 2;
  repeated string command   = 3;
  repeated string env       = 4; // KEY=VALUE
  repeated PortMapping ports = 5;
  repeated VolumeMount volumes = 6;
  map<string, string> labels = 7;
  string namespace   = 8; // nerdctl namespace; defaults to "orchestrator"
  map<string, string> secret_refs = 9; // env_var_name → secret_name; resolved at placement
  int32  replicas    = 10; // desired replica count; 0/1 = single instance
  bool   insecure_registry = 11; // pass --insecure-registry to nerdctl (plain-HTTP or self-signed registries)
}

message ComposeStackSpec {
  string name         = 1;
  string compose_yaml = 2; // inline compose file content
  map<string, string> secret_refs = 3; // env_var_name → secret_name; resolved at placement
  int32  replicas    = 4; // desired replica count; 0/1 = single instance
  bool   insecure_registry = 5; // pass --insecure-registry to nerdctl (plain-HTTP or self-signed registries)
  repeated ComposeSecretMount secret_mounts = 6; // per-service file-mounted secrets; resolved at placement
}

// ComposeSecretMount declares that Service should get SecretName mounted as a
// file inside a compose stack. Resolved into a ResolvedSecretFile at placement.
message ComposeSecretMount {
  string service     = 1;
  string secret_name = 2;
  string target      = 3; // defaults to "/run/secrets/<secret_name>" when empty
  uint32 mode         = 4; // file perm bits; default 0400
}

// ResolvedSecretFile carries one secret's plaintext, resolved from OpenBao at
// placement time, from the leader to the target node over the placement RPC.
// Present only on Workload (never on ContainerSpec/ComposeStackSpec, which are
// Raft-persisted), so plaintext never enters the durable log.
message ResolvedSecretFile {
  string name      = 1; // secret name
  string target    = 2; // in-container path
  uint32 mode      = 3;
  string service   = 4; // compose service name; empty for single containers
  string plaintext = 5;
}

// Secret holds metadata for a named cluster secret. Values live in OpenBao;
// only the path reference is stored in Raft state.
message Secret {
  string id         = 1;
  string name       = 2;
  int64  created_at = 3; // unix seconds
  string bao_path   = 4; // KV v2 path within the configured mount, e.g. "orchestrator/db-password"
}

// OpenBaoConfig holds connection parameters for the cluster's OpenBao instance.
// Stored in Raft so all nodes can resolve secrets at placement time.
// The token is a service token scoped to KV read/write on <mount>/data/orchestrator/*.
message OpenBaoConfig {
  reserved 4;
  reserved "ca_cert"; // superseded by the cluster-wide TrustedCA store (web UI only, no proto)
  string address = 1; // e.g. "https://bao.example.com:8200"
  string token   = 2; // service token; used when role_id is empty
  string mount   = 3; // KV v2 mount path (default "secret")
  bool insecure_skip_verify = 5; // skip TLS certificate verification entirely (testing only)
  string role_id    = 6; // AppRole role_id; when set, AppRole login is used instead of token
  string secret_id  = 7; // AppRole secret_id
  string auth_mount = 8; // AppRole auth backend mount path (default "approle")
}

message PortMapping {
  uint32 host_port      = 1;
  uint32 container_port = 2;
  string protocol       = 3; // tcp | udp
}

message VolumeMount {
  string source = 1; // host path or named volume, or secret name when type=="secret"
  string target = 2; // container path
  bool   read_only = 3;
  string type = 4; // "" (bind, default) | "volume" | "secret"
  uint32 mode = 5; // file perm bits; meaningful only when type=="secret"; default 0400
}

// ── Port allocation ───────────────────────────────────────────────────────────

// PortAllocation records the host port the orchestrator bound for one container port.
message PortAllocation {
  uint32 container_port = 1;
  uint32 allocated_port = 2; // loopback/dataIP port chosen by the leader
  string protocol       = 3; // tcp | udp
}

// ── Workload (union of container or stack) ────────────────────────────────────

message Workload {
  string id = 1;
  oneof spec {
    ContainerSpec   container = 2;
    ComposeStackSpec stack    = 3;
  }
  WorkloadPhase phase       = 4;
  string        node_id     = 5; // assigned node; empty = unscheduled
  int64         created_at  = 6; // unix seconds
  repeated PortAllocation port_allocations = 7; // auto-assigned host ports
  string        group_name  = 8; // set on replica instances; links them to the parent workload name
  repeated ResolvedSecretFile resolved_secret_files = 9; // plaintext secret-volume contents; leader→agent only, never Raft-persisted
  repeated string resolved_env = 10; // stack env-secrets resolved to KEY=VALUE; leader→agent only, never Raft-persisted
                                      // (fixes a pre-existing gap: ComposeStackSpec.ResolvedEnv never had a proto field,
                                      // so stack env-secrets never reached the target node's ComposeUp)
}

enum WorkloadPhase {
  WORKLOAD_PHASE_UNSPECIFIED = 0;
  PENDING                    = 1; // accepted, not yet placed
  SCHEDULED                  = 2; // placed on a node, agent not yet confirmed
  RUNNING                    = 3;
  STOPPED                    = 4;
  FAILED                     = 5;
}

// ── Node ─────────────────────────────────────────────────────────────────────

message Node {
  string node_id       = 1;
  string address       = 2; // host:port for gRPC
  NodeStatus status    = 3;
  NodeResources resources = 4;
  int64  last_seen_at  = 5; // unix seconds
  bytes  tls_cert      = 6; // DER-encoded self-signed cert for mTLS key pinning
  string data_ip       = 7; // routable IP for container traffic (ingress backend)
  // Mesh overlay (see docs/mesh-network.md). pub_key/endpoint are node-published;
  // subnet/addr are leader-assigned from the cluster mesh CIDR.
  string mesh_pub_key  = 8;  // WireGuard public key (base64)
  string mesh_endpoint = 9;  // reachable WireGuard UDP endpoint (host:port)
  string mesh_subnet   = 10; // leader-assigned /24, e.g. 100.64.3.0/24
  string mesh_addr     = 11; // this node's own mesh address (first host of subnet)
}

// ── Ingress ───────────────────────────────────────────────────────────────────

message IngressRule {
  string id             = 1;
  string host           = 2; // Host header to match; empty = match all
  string path_prefix    = 3; // URL path prefix to match; empty = "/"
  string container_fqdn = 4; // target container: "workload" or "service.workload"
  uint32 container_port = 5; // port the container listens on
  uint32 system_port    = 6; // auto-assigned from ingress pool (43000–45767)
  int64  created_at     = 7; // unix seconds
  bool   strip_prefix   = 8; // strip path_prefix before forwarding to backend
}

// ── Service discovery ─────────────────────────────────────────────────────────

// Service exposes a named TCP endpoint for a container. The system auto-assigns
// a port from the service pool (40000–42767). Clients reach it via
// nodeDataIP:SystemPort; proxyd forwards to the container.
message Service {
  string id             = 1;
  string name           = 2; // short DNS label, e.g. "api"
  string container_fqdn = 3; // target container: "workload" or "service.workload"
  uint32 container_port = 4; // port the container listens on
  uint32 system_port    = 5; // auto-assigned host port (40000–42767)
  int64  created_at     = 6; // unix seconds
}

message NodeResources {
  uint32 cpu_cores      = 1;
  uint64 memory_bytes   = 2;
  uint64 disk_bytes     = 3;
}

enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  HEALTHY                 = 1;
  DRAINING                = 2;
  UNREACHABLE             = 3;
}

// ── Shared RPC request/response types ────────────────────────────────────────

message RemoveWorkloadRequest {
  string workload_id = 1;
}

message RemoveWorkloadResponse {
  bool   accepted = 1;
  string reason   = 2;
}

// ── Actual state reported by agents ──────────────────────────────────────────

message ActualContainer {
  string workload_id  = 1;
  string container_id = 2; // nerdctl container ID
  string name         = 3;
  string status       = 4; // nerdctl status string (running, exited, etc.)
  int64  started_at   = 5; // unix seconds; 0 if not running
  string mesh_ip      = 6; // container's IP on the mesh0 bridge; empty if not on mesh
}

message ActualStack {
  string workload_id = 1;
  string name        = 2;
  repeated ActualContainer services = 3;
}

message ActualWorkloadState {
  string node_id = 1;
  repeated ActualContainer containers = 2;
  repeated ActualStack     stacks     = 3;
  int64  reported_at = 4; // unix seconds
}
