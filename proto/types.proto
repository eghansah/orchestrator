syntax = "proto3";

package orchestrator;

option go_package = "github.com/eghansah/orchestrator/internal/grpc/gen";

// ── Workload specs ────────────────────────────────────────────────────────────

message ContainerSpec {
  string name        = 1;
  string image       = 2;
  repeated string command   = 3;
  repeated string env       = 4; // KEY=VALUE
  repeated PortMapping ports = 5;
  repeated VolumeMount volumes = 6;
  map<string, string> labels = 7;
  string namespace   = 8; // nerdctl namespace; defaults to "orchestrator"
  map<string, string> secret_refs = 9; // env_var_name → secret_name; resolved at placement
}

message ComposeStackSpec {
  string name         = 1;
  string compose_yaml = 2; // inline compose file content
  map<string, string> secret_refs = 3; // env_var_name → secret_name; resolved at placement
}

// Secret holds metadata for a named cluster secret. The encrypted value is
// stored server-side only; it is never returned in list or get responses.
message Secret {
  string id         = 1;
  string name       = 2;
  int64  created_at = 3; // unix seconds
}

message PortMapping {
  uint32 host_port      = 1;
  uint32 container_port = 2;
  string protocol       = 3; // tcp | udp
}

message VolumeMount {
  string source = 1; // host path or named volume
  string target = 2; // container path
  bool   read_only = 3;
}

// ── Port allocation ───────────────────────────────────────────────────────────

// PortAllocation records the host port the orchestrator bound for one container port.
message PortAllocation {
  uint32 container_port = 1;
  uint32 allocated_port = 2; // loopback/dataIP port chosen by the leader
  string protocol       = 3; // tcp | udp
}

// ── Workload (union of container or stack) ────────────────────────────────────

message Workload {
  string id = 1;
  oneof spec {
    ContainerSpec   container = 2;
    ComposeStackSpec stack    = 3;
  }
  WorkloadPhase phase       = 4;
  string        node_id     = 5; // assigned node; empty = unscheduled
  int64         created_at  = 6; // unix seconds
  repeated PortAllocation port_allocations = 7; // auto-assigned host ports
}

enum WorkloadPhase {
  WORKLOAD_PHASE_UNSPECIFIED = 0;
  PENDING                    = 1; // accepted, not yet placed
  SCHEDULED                  = 2; // placed on a node, agent not yet confirmed
  RUNNING                    = 3;
  STOPPED                    = 4;
  FAILED                     = 5;
}

// ── Node ─────────────────────────────────────────────────────────────────────

message Node {
  string node_id       = 1;
  string address       = 2; // host:port for gRPC
  NodeStatus status    = 3;
  NodeResources resources = 4;
  int64  last_seen_at  = 5; // unix seconds
  bytes  tls_cert      = 6; // DER-encoded self-signed cert for mTLS key pinning
  string data_ip       = 7; // routable IP for container traffic (ingress backend)
  // Mesh overlay (see docs/mesh-network.md). pub_key/endpoint are node-published;
  // subnet/addr are leader-assigned from the cluster mesh CIDR.
  string mesh_pub_key  = 8;  // WireGuard public key (base64)
  string mesh_endpoint = 9;  // reachable WireGuard UDP endpoint (host:port)
  string mesh_subnet   = 10; // leader-assigned /24, e.g. 100.64.3.0/24
  string mesh_addr     = 11; // this node's own mesh address (first host of subnet)
}

// ── Ingress ───────────────────────────────────────────────────────────────────

message IngressRule {
  string id             = 1;
  string host           = 2; // Host header to match; empty = match all
  string path_prefix    = 3; // URL path prefix to match; empty = "/"
  string container_fqdn = 4; // target container: "workload" or "service.workload"
  uint32 container_port = 5; // port the container listens on
  uint32 system_port    = 6; // auto-assigned from ingress pool (43000–45767)
  int64  created_at     = 7; // unix seconds
}

// ── Service discovery ─────────────────────────────────────────────────────────

// Service exposes a named TCP endpoint for a container. The system auto-assigns
// a port from the service pool (40000–42767). Clients reach it via
// nodeDataIP:SystemPort; proxyd forwards to the container.
message Service {
  string id             = 1;
  string name           = 2; // short DNS label, e.g. "api"
  string container_fqdn = 3; // target container: "workload" or "service.workload"
  uint32 container_port = 4; // port the container listens on
  uint32 system_port    = 5; // auto-assigned host port (40000–42767)
  int64  created_at     = 6; // unix seconds
}

message NodeResources {
  uint32 cpu_cores      = 1;
  uint64 memory_bytes   = 2;
  uint64 disk_bytes     = 3;
}

enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  HEALTHY                 = 1;
  DRAINING                = 2;
  UNREACHABLE             = 3;
}

// ── Shared RPC request/response types ────────────────────────────────────────

message RemoveWorkloadRequest {
  string workload_id = 1;
}

message RemoveWorkloadResponse {
  bool   accepted = 1;
  string reason   = 2;
}

// ── Actual state reported by agents ──────────────────────────────────────────

message ActualContainer {
  string workload_id  = 1;
  string container_id = 2; // nerdctl container ID
  string name         = 3;
  string status       = 4; // nerdctl status string (running, exited, etc.)
  int64  started_at   = 5; // unix seconds; 0 if not running
}

message ActualStack {
  string workload_id = 1;
  string name        = 2;
  repeated ActualContainer services = 3;
}

message ActualWorkloadState {
  string node_id = 1;
  repeated ActualContainer containers = 2;
  repeated ActualStack     stacks     = 3;
  int64  reported_at = 4; // unix seconds
}
